<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 浏览器标签页的名称 -->
    <title>“记录，是为了不让闪光的思考在平淡的日子里沉没。”</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f7f9fa;
            color: #2c3e50;
            line-height: 1.8;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            max-width: 680px;
            width: 100%;
            padding: 45px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        /* 大标题样式 */
        h1 {
            font-size: 1.8rem;
            color: #1a1a1a;
            margin-bottom: 25px;
            font-weight: 700;
            line-height: 1.4;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s ease;
        }

        h1:hover {
            color: #6b46c1;
        }

        p {
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: #4a5568;
        }

        /* 图片容器样式 */
        .image-container {
            margin-top: 20px;
            text-align: center;
        }

        .image-container img {
            max-width: 200px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            cursor: pointer; 
            /* 添加过渡效果，实现透明度渐变 */
            transition: opacity 0.4s ease, transform 0.3s ease;
            opacity: 1;
        }

        .image-container img:hover {
            transform: scale(1.05);
        }

        /* 渐隐淡出的状态类 */
        .fade-out {
            opacity: 0;
        }

        .image-tip {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #a0aec0;
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #edf2f7;
            text-align: center;
            font-size: 0.85rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 页面内的大标题 -->
        <h1 id="mainTitle" onclick="switchContent()">奋斗の凯哥</h1>

        <!-- 图片切换部分 -->
        <div class="image-container">
            <img id="toggleImg" src="https://wsxiao93ovo.github.io/Xiao93/123.jpg" alt="图片切换" onclick="switchContent()">
            <p class="image-tip">点击图片或大标题可切换</p>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            &copy; 小玖叁
        </div>
    </div>

    <!-- JavaScript 逻辑：实现带渐隐效果的切换 -->
    <script>
        const img1 = "https://wsxiao93ovo.github.io/Xiao93/123.jpg";
        const img2 = "https://wsxiao93ovo.github.io/Xiao93/128.jpg";

        const title1 = "奋斗の凯哥";
        const title2 = "凯哥の诱惑";

        let isFirstState = true; 

        function switchContent() {
            const titleElement = document.getElementById("mainTitle");
            const imgElement = document.getElementById("toggleImg");

            // 1. 先让图片透明度变为 0（开始渐隐）
            imgElement.classList.add("fade-out");

            // 2. 等待渐隐动画结束后（400毫秒），更换图片和标题，再让其显现
            setTimeout(() => {
                if (isFirstState) {
                    titleElement.textContent = title2;
                    imgElement.src = img2;
                } else {
                    titleElement.textContent = title1;
                    imgElement.src = img1;
                }
                
                // 3. 移除渐隐类，让新图片淡入显示
                imgElement.classList.remove("fade-out");
                
                isFirstState = !isFirstState; 
            }, 400); // 时间与 CSS 中的 transition 保持一致
        }
    </script>

</body>
</html>
