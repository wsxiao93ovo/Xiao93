<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 浏览器标签页的名称 -->
    <title>“记录，是为了不让闪光的思考在平淡的日子里沉没。”</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f7f9fa;
            color: #2c3e50;
            line-height: 1.8;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            max-width: 680px;
            width: 100%;
            padding: 45px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.8rem;
            color: #1a1a1a;
            margin-bottom: 25px;
            font-weight: 700;
            line-height: 1.4;
        }

        p {
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: #4a5568;
        }

        .tag {
            display: inline-block;
            background-color: #f3e8ff;
            color: #6b46c1;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #edf2f7;
            text-align: center;
            font-size: 0.85rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 页面内的标题 -->
        <h1>嗨，你好</h1>
        <!-- 页脚 -->
        <div class="footer">
            &copy; 小玖叁
        </div>
    </div>

</body>
</html>
